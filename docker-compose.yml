# Local prototype stack: sim API + web console + Laravel board API.
# History stays per-browser in localStorage; ranks live in the board's
# SQLite file. See README.md for the workspace map and quick start.
services:
  sim:
    build: ./app/sim
    ports:
      - "${SIM_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    restart: "no"

  board:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - "${BOARD_PORT:-8001}:8001"
    command: >
      sh -c "touch database/database.sqlite &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8001"
    restart: "no"

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - SIM_API_URL=http://sim:8000
      - LARAVEL_URL=http://board:8001
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - sim
      - board
    restart: "no"
