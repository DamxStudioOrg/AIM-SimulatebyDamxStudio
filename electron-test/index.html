<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Electron Test - macOS</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; background: #f5f5f7; color: #1d1d1f; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 600px; }
    h1 { margin-top: 0; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Electron Test App</h1>
    <p>Running on macOS</p>
    <p>Platform: <code id="platform">loading...</code></p>
    <p>Electron version: <code id="electron">loading...</code></p>
    <p>Node version: <code id="node">loading...</code></p>
    <p>Chromium version: <code id="chrome">loading...</code></p>
    <p>If you see this, Electron is working!</p>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('platform').textContent = window.electronAPI.platform;
      document.getElementById('electron').textContent = window.electronAPI.versions.electron;
      document.getElementById('node').textContent = window.electronAPI.versions.node;
      document.getElementById('chrome').textContent = window.electronAPI.versions.chrome;
    });
  </script>
</body>
</html>
