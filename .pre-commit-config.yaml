repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: \.(md|json|yaml|yml)$
  - repo: local
    hooks:
      - id: web-quality
        name: web quality
        entry: npm run quality
        language: system
        files: ^web/
      - id: sim-quality
        name: sim quality
        entry: bash -c "cd app/sim && PYTHONPATH=src python -m unittest discover -s tests"
        language: system
        files: ^app/sim/
